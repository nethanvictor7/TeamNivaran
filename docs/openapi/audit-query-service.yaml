openapi: 3.1.0
info:
  title: CDEP Audit Query API
  version: 1.0.0
  description: Tenant-scoped audit search, journeys, reports, exports, and projection operations.
servers:
  - url: /api/v1/audit
security:
  - bearerAuth: []
paths:
  /records:
    get:
      summary: Search sanitized audit records
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: eventType,
            in: query,
            schema: { type: string, maxLength: 160 },
          }
        - {
            name: outcome,
            in: query,
            schema: { $ref: "#/components/schemas/AuditOutcome" },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200": { description: Tenant-bound keyset page }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /records/{auditId}:
    get:
      summary: Read a sanitized audit record
      parameters:
        - {
            name: auditId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Sanitized record }
        "404": { $ref: "#/components/responses/Problem" }
  /cases/{caseId}/journey:
    get:
      summary: Read a server-composed case decision journey
      parameters:
        - {
            name: caseId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Ordered tenant-scoped journey }
  /chain/verify:
    get:
      summary: Verify the canonical tenant audit chain
      responses:
        "200": { description: Integrity result }
  /reports/catalog:
    get:
      summary: List versioned approved reports
      responses:
        "200": { description: Report catalog }
  /reports:
    get:
      summary: List report runs
      responses:
        "200": { description: Report history }
    post:
      summary: Schedule a snapshot-consistent report
      parameters:
        - {
            name: idempotency-key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 200 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "202": { description: Report accepted }
  /reports/{runId}/download:
    get:
      summary: Create an authorized short-lived report download grant
      parameters:
        - {
            name: runId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Short-lived download grant }
  /exports:
    get:
      summary: List export runs
      responses:
        "200": { description: Export history }
    post:
      summary: Schedule a bounded CSV or JSON export
      parameters:
        - {
            name: idempotency-key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 200 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202": { description: Export accepted }
  /exports/{runId}/cancel:
    post:
      summary: Cancel an export that is still pending
      parameters:
        - {
            name: runId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Export cancelled }
        "409": { $ref: "#/components/responses/Problem" }
  /exports/{runId}/download:
    get:
      summary: Create an authorized short-lived export download grant
      parameters:
        - {
            name: runId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Short-lived download grant }
  /operations:
    get:
      summary: Inspect projection freshness, quarantine, and jobs
      responses:
        "200": { description: Operational state }
    post:
      summary: Schedule a reason-gated dry-run or controlled operation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationRequest" }
      responses:
        "202": { description: Operation accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 7807-style safe problem response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    AuditOutcome:
      type: string
      enum: [SUCCESS, FAILURE, DENIED, PENDING, INFORMATIONAL]
    ReportRequest:
      type: object
      additionalProperties: false
      required: [reportKey]
      properties:
        reportKey:
          type: string
          enum:
            [
              CASE_DECISION_DOSSIER,
              EVIDENCE_VALIDATION_HISTORY,
              HUMAN_DECISION_SUMMARY,
              LEDGER_VERIFICATION_HISTORY,
              OPERATIONAL_AUDIT_ACTIVITY,
              AI_ASSESSMENT_GOVERNANCE,
            ]
        parameters: { type: object, additionalProperties: true, default: {} }
    ExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [CSV, JSON] }
        filters: { type: object, additionalProperties: false, default: {} }
    OperationRequest:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          { type: string, enum: [REPLAY, PROJECTION_REBUILD, RECONCILIATION] }
        reason: { type: string, minLength: 10, maxLength: 500 }
        dryRun: { type: boolean, default: true }
        parameters: { type: object, additionalProperties: true, default: {} }
    Problem:
      type: object
      required: [type, title, status, code, detail, correlationId, timestamp]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
