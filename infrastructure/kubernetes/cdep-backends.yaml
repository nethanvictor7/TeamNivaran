apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-access-service
  namespace: cdep
  labels:
    app.kubernetes.io/name: identity-access-service
    app.kubernetes.io/part-of: cdep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-access-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-access-service
        app.kubernetes.io/part-of: cdep
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-access-service
          image: registry.gitlab.com/reboot4443731/cdep/identity-access-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: cdep-runtime-config
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cdep-database-urls
                  key: IDENTITY_DATABASE_URL
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cdep-runtime-secrets
                  key: INTERNAL_SERVICE_TOKEN
            - name: JWT_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: cdep-runtime-secrets
                  key: JWT_PRIVATE_KEY_BASE64
            - name: JWT_PUBLIC_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: cdep-runtime-secrets
                  key: JWT_PUBLIC_KEY_BASE64
          ports:
            - name: http
              containerPort: 3001
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-access-service
  namespace: cdep
spec:
  selector:
    app.kubernetes.io/name: identity-access-service
  ports:
    - name: http
      port: 3001
      targetPort: http
---
