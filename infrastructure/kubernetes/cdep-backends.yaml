apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: cdep
  labels:
    app.kubernetes.io/name: ledger-service
    app.kubernetes.io/part-of: cdep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
        app.kubernetes.io/part-of: cdep
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-service
          image: registry.gitlab.com/reboot4443731/cdep/ledger-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: cdep-runtime-config
          env:
            - name: PORT
              value: "3007"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cdep-database-urls
                  key: LEDGER_DATABASE_URL
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cdep-runtime-secrets
                  key: INTERNAL_SERVICE_TOKEN
          ports:
            - name: http
              containerPort: 3007
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  fetch('http://localhost:3007/health/ready')
                  .then(r => r.json()).then(v => {
                  if (v.status !== 'ok') process.exit(1); })
                  .catch(() => process.exit(1))
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: fabric-client
              mountPath: /fabric/client
              readOnly: true
      volumes:
        - name: fabric-client
          secret:
            secretName: fabric-client-identity
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: cdep
spec:
  selector:
    app.kubernetes.io/name: ledger-service
  ports:
    - name: http
      port: 3007
      targetPort: http
