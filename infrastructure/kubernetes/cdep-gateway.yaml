apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cdep-public
  namespace: cdep
  labels:
    app.kubernetes.io/name: cdep-public
    app.kubernetes.io/part-of: cdep
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: cdep-web-ip
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cdep-public
  namespace: cdep
  labels:
    app.kubernetes.io/name: cdep-public
    app.kubernetes.io/part-of: cdep
spec:
  parentRefs:
    - name: cdep-public
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-gateway
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web-portal
          port: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: api-gateway-health
  namespace: cdep
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: cdep
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /health/live
  targetRef:
    group: ""
    kind: Service
    name: api-gateway
