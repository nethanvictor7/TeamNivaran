apiVersion: v1
kind: Namespace
metadata:
  name: cdep
  labels:
    app.kubernetes.io/part-of: cdep
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: cdep
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: cdep
data:
  PORT: "3000"
  IDENTITY_SERVICE_URL: http://identity-access-service:3001
  CASE_SERVICE_URL: http://case-service:3002
  INTEGRATION_SERVICE_URL: http://integration-ingestion-service:3003
  EVIDENCE_SERVICE_URL: http://evidence-service:3004
  WORKFLOW_SERVICE_URL: http://validation-workflow-service:3005
  AI_ASSESSMENT_SERVICE_URL: http://ai-assessment-service:3006
  LEDGER_SERVICE_URL: http://ledger-service:3007
  AUDIT_SERVICE_URL: http://audit-query-service:3008
  JWT_JWKS_URL: http://identity-access-service:3001/api/v1/auth/jwks
  JWT_ISSUER: cdep-identity-access-service
  JWT_AUDIENCE: cdep-api
  EVIDENCE_MAX_UPLOAD_BYTES: "10485760"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: cdep
  labels:
    app.kubernetes.io/name: web-portal
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cdep
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-portal
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cdep
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web-portal
      containers:
        - name: web-portal
          image: registry.gitlab.com/reboot4443731/cdep/web-portal:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: cdep
  labels:
    app.kubernetes.io/name: web-portal
    app.kubernetes.io/part-of: cdep
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-portal
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cdep
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cdep
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: cdep
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: registry.gitlab.com/reboot4443731/cdep/api-gateway:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: api-gateway-config
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cdep
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: cdep
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
