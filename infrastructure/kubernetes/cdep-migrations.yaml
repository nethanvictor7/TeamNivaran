apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate
  namespace: cdep
  labels:
    app.kubernetes.io/name: identity-migrate
    app.kubernetes.io/part-of: cdep
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: migrate
          image: registry.gitlab.com/reboot4443731/cdep/identity-access-service:latest
          imagePullPolicy: Always
          command:
            - ./node_modules/.bin/prisma
            - migrate
            - deploy
            - --schema
            - apps/identity-access-service/prisma/schema.prisma
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cdep-database-urls
                  key: IDENTITY_DATABASE_URL
---
